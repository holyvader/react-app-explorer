<!doctype html>
<!--
  The .dmg window's background (660 × 400, Finder's window): the app as a file frame, Applications as a
  folder frame, an "installs" relation between them — the way the app draws a diagram. Finder draws
  the two icons and their names itself, in the frames (package.ts: app at 165,192, Applications at
  495,192). Finder colours the names (black in Light Mode, white in Dark Mode) and a .dmg has one
  background for both, so the window is a slate halfway in lightness (#6F7783: 4.6:1 with black,
  4.5:1 with white); the frames are outlines over it, and our own text sits on dark plates. Rendered to background.png and background@2x.png by render.ts; fonts come from the
  design system's bundled files (render.ts puts their @font-face rules in place of FONTS below).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*FONTS*/
html, body { margin: 0; background: #6F7783; }
.window {
  position: relative; width: 660px; height: 400px; overflow: hidden;
  background-color: #6F7783;
  background-image: radial-gradient(rgba(255, 255, 255, 0.16) 1.2px, transparent 1.2px);
  background-size: 16px 16px;
  font-family: "IBM Plex Sans Variable", system-ui, sans-serif; color: #E6E7EA;
}
/* outlines only: under Finder's names the window's slate must show */
.frame { position: absolute; top: 70px; width: 200px; height: 236px; box-sizing: border-box; border-radius: 12px; }
.frame--app { left: 65px; border: 1.5px solid rgba(255, 255, 255, 0.55); }
.frame--folder { left: 395px; border: 1.5px dashed rgba(255, 255, 255, 0.5); }
.frame__head {
  height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border-radius: 10.5px 10.5px 0 0; background: #1E2025;
  font-family: "JetBrains Mono Variable", ui-monospace, monospace; font-size: 11px; color: #E6E7EA;
  white-space: nowrap; overflow: hidden;
}
.label {
  position: absolute; left: 298px; top: 172px; padding: 2px 8px; border-radius: 5px; background: #1E2025;
  font-family: "JetBrains Mono Variable", ui-monospace, monospace; font-size: 11px; color: #7FD2E6;
}
.hint {
  position: absolute; left: 65px; bottom: 26px; display: flex; align-items: center; gap: 8px;
  padding: 5px 12px 5px 9px; border-radius: 999px; background: #1E2025; color: #C7C9CE; font-size: 12px;
}
</style>
</head>
<body>
<div class="window">
  <div class="frame frame--app">
    <div class="frame__head">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#AEB1B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
      React App Explorer.app
    </div>
  </div>
  <div class="frame frame--folder">
    <div class="frame__head">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#AEB1B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      /Applications
    </div>
  </div>
  <svg width="660" height="400" viewBox="0 0 660 400" style="position: absolute; inset: 0">
    <path d="M265 196 C 320 196, 340 196, 393 196" fill="none" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round"/>
    <circle cx="265" cy="196" r="5" fill="#FFFFFF" stroke="#6F7783" stroke-width="2"/>
    <path d="M381 188.5 L 394 196 L 381 203.5 z" fill="#FFFFFF"/>
  </svg>
  <span class="label">installs</span>
  <div class="hint">
    <svg width="16" height="16" viewBox="0 0 96 96"><g fill="none" stroke="#E6E7EA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M31.75 57.5 22.25 48 31.75 38.5"/><path d="M64.25 57.5 73.75 48 64.25 38.5"/><circle cx="48" cy="48" r="8" fill="#E6E7EA" stroke="none"/></g></svg>
    Drag the app onto Applications
  </div>
</div>
</body>
</html>
