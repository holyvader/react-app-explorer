<!doctype html>
<!--
  The .dmg window's background (660 × 400, Finder's window): transparent, so Finder's own window shows
  through and follows Light / Dark Mode, as do the names Finder writes under the icons. Drawn on it:
  the mark and name, a hairline, three chevrons from the app (165,192) to
  Applications (495,192), and how to install. One grey for all of it (#7E7E7E, about 4.1:1 on both
  Finder's white and its dark window). Rendered to background.png and background@2x.png by render.ts
  (transparent PNGs); fonts come from the design system's bundled files (render.ts puts their
  @font-face rules in place of FONTS below).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*FONTS*/
html, body { margin: 0; background: transparent; }
.window { position: relative; width: 660px; height: 400px; overflow: hidden; font-family: "IBM Plex Sans Variable", system-ui, sans-serif; color: #7E7E7E; }
.top { position: absolute; left: 32px; right: 32px; top: 24px; display: flex; align-items: center; gap: 10px; }
.name { flex: 1; font-size: 16px; font-weight: 700; }
.rule { position: absolute; left: 32px; right: 32px; top: 64px; border-top: 1px solid rgba(126, 126, 126, 0.45); }
.chevrons { position: absolute; left: 290px; top: 180px; width: 80px; display: flex; justify-content: center; gap: 4px; }
.hint { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<div class="window">
  <div class="top">
    <svg width="22" height="22" viewBox="0 0 96 96"><g fill="none" stroke="#7E7E7E" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"><path d="M31.75 57.5 22.25 48 31.75 38.5"/><path d="M64.25 57.5 73.75 48 64.25 38.5"/><circle cx="48" cy="48" r="8" fill="#7E7E7E" stroke="none"/></g></svg>
    <span class="name">React App Explorer</span>
  </div>
  <div class="rule"></div>
  <div class="chevrons">
    <svg width="14" height="24" viewBox="0 0 14 24"><path d="M3 3 L11 12 L3 21" fill="none" stroke="#7E7E7E" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg width="14" height="24" viewBox="0 0 14 24"><path d="M3 3 L11 12 L3 21" fill="none" stroke="#7E7E7E" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg width="14" height="24" viewBox="0 0 14 24"><path d="M3 3 L11 12 L3 21" fill="none" stroke="#7E7E7E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <p class="hint" style="margin: 0">To install, drag the app onto the Applications folder.</p>
</div>
</body>
</html>
