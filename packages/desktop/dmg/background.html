<!doctype html>
<!--
  The .dmg window's background (660 × 400, Finder's window): the app as a file frame, Applications as a
  folder frame, an "installs" relation between them — the way the app draws a diagram. Finder draws
  the two icons and their names itself, in the frames (package.ts: app at 165,192, Applications at
  495,192). Rendered to background.png and background@2x.png by render.ts; fonts come from the
  design system's bundled files (render.ts puts their @font-face rules in place of FONTS below).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*FONTS*/
html, body { margin: 0; background: #121316; }
.window {
  position: relative; width: 660px; height: 400px; overflow: hidden;
  background-color: #121316;
  background-image: radial-gradient(#26282D 1.2px, transparent 1.2px);
  background-size: 16px 16px;
  font-family: "IBM Plex Sans Variable", system-ui, sans-serif; color: #E6E7EA;
}
.frame { position: absolute; top: 70px; width: 200px; height: 236px; box-sizing: border-box; border-radius: 12px; }
.frame--app { left: 65px; border: 1px solid #33353B; background: rgba(30, 32, 37, 0.55); }
.frame--folder { left: 395px; border: 1px dashed #44474E; }
.frame__head {
  height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  font-family: "JetBrains Mono Variable", ui-monospace, monospace; font-size: 11px; color: #AEB1B8;
  white-space: nowrap; overflow: hidden;
}
.frame--app .frame__head { border-bottom: 1px solid #26282D; }
.frame--folder .frame__head { border-bottom: 1px dashed #33353B; }
/* where Finder writes the icon's name (just under the 128 px icon centred at y 192): a slate row
   halfway in lightness, so Finder's black names (Light Mode) and white ones (Dark Mode) both read
   at 4.5:1 or more — Finder picks the colour, a .dmg can't */
.name-row { position: absolute; left: 8px; right: 8px; top: 180px; height: 40px; border-radius: 7px; background: #6F7783; }
.label {
  position: absolute; left: 300px; top: 172px; padding: 1px 7px; border-radius: 4px; background: #121316;
  font-family: "JetBrains Mono Variable", ui-monospace, monospace; font-size: 11px; color: #7FD2E6;
}
.hint { position: absolute; left: 65px; bottom: 30px; display: flex; align-items: center; gap: 8px; color: #8A8D94; font-size: 12px; }
</style>
</head>
<body>
<div class="window">
  <div class="frame frame--app">
    <div class="frame__head">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8D94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
      React App Explorer.app
    </div>
    <div class="name-row"></div>
  </div>
  <div class="frame frame--folder">
    <div class="frame__head">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8D94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      /Applications
    </div>
    <div class="name-row"></div>
  </div>
  <svg width="660" height="400" viewBox="0 0 660 400" style="position: absolute; inset: 0">
    <path d="M265 196 C 320 196, 340 196, 393 196" fill="none" stroke="#3FB7D4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="265" cy="196" r="4.5" fill="#3FB7D4" stroke="#121316" stroke-width="2"/>
    <path d="M382 189 L 394 196 L 382 203 z" fill="#3FB7D4"/>
  </svg>
  <span class="label">installs</span>
  <div class="hint">
    <svg width="18" height="18" viewBox="0 0 96 96"><g fill="none" stroke="#AEB1B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M31.75 57.5 22.25 48 31.75 38.5"/><path d="M64.25 57.5 73.75 48 64.25 38.5"/><circle cx="48" cy="48" r="8" fill="#AEB1B8" stroke="none"/></g></svg>
    Drag the app onto Applications
  </div>
</div>
</body>
</html>
