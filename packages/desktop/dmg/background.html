<!doctype html>
<!--
  The .dmg window's background (660 × 400, Finder's window), in the app's Paper palette: the mark and
  name, a hairline, three chevrons from the app (165,192) to Applications (495,192), and how to
  install. Light in both appearances on purpose: Finder puts a background picture on white even in
  Dark Mode (transparency doesn't let its dark window through) and keeps the icons' names black over
  one, so a light picture is the one that reads either way. Rendered to background.png and
  background@2x.png by render.ts; fonts come from the design system's bundled files (render.ts puts their
  @font-face rules in place of FONTS below).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*FONTS*/
html, body { margin: 0; background: #F7F6F3; }
.window { position: relative; width: 660px; height: 400px; overflow: hidden; font-family: "IBM Plex Sans Variable", system-ui, sans-serif; color: #1F1E1C; background: #F7F6F3; }
.top { position: absolute; left: 32px; right: 32px; top: 24px; display: flex; align-items: center; gap: 10px; }
.name { flex: 1; font-size: 16px; font-weight: 700; }
.rule { position: absolute; left: 32px; right: 32px; top: 64px; border-top: 1px solid #E2E0DA; }
.chevrons { position: absolute; left: 290px; top: 180px; width: 80px; display: flex; justify-content: center; gap: 4px; }
.hint { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 13px; color: #6F6C66; }
</style>
</head>
<body>
<div class="window">
  <div class="top">
    <svg width="22" height="22" viewBox="0 0 96 96"><g fill="none" stroke="#1F1E1C" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"><path d="M31.75 57.5 22.25 48 31.75 38.5"/><path d="M64.25 57.5 73.75 48 64.25 38.5"/><circle cx="48" cy="48" r="8" fill="#1F1E1C" stroke="none"/></g></svg>
    <span class="name">React App Explorer</span>
  </div>
  <div class="rule"></div>
  <div class="chevrons">
    <svg width="14" height="24" viewBox="0 0 14 24"><path d="M3 3 L11 12 L3 21" fill="none" stroke="#D9D6CE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg width="14" height="24" viewBox="0 0 14 24"><path d="M3 3 L11 12 L3 21" fill="none" stroke="#B9B5AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg width="14" height="24" viewBox="0 0 14 24"><path d="M3 3 L11 12 L3 21" fill="none" stroke="#8A877F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <p class="hint" style="margin: 0">To install, drag the app onto the Applications folder.</p>
</div>
</body>
</html>
