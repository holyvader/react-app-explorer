<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1D4E63"/>
      <stop offset="0.55" stop-color="#14304A"/>
      <stop offset="1" stop-color="#0B1426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#7DD3E8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7DD3E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6EEF4"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#82C8DA"/><stop offset="1" stop-color="#429CB5"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#F97316"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/></filter>
  </defs>
  <!-- macOS icon grid: 824px body on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  <!-- orbit -->
  <circle cx="512" cy="500" r="196" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" stroke-dasharray="2 30" stroke-linecap="round"/>
  <!-- relations -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="22" stroke-linecap="round">
    <line x1="512" y1="500" x2="318" y2="322"/>
    <line x1="512" y1="500" x2="716" y2="330"/>
    <line x1="512" y1="500" x2="600" y2="732"/>
  </g>
  <!-- elements: component, hook, server action -->
  <rect x="244" y="248" width="148" height="148" rx="40" fill="url(#teal)"/>
  <rect x="648" y="262" width="136" height="136" rx="68" fill="url(#violet)"/>
  <rect x="536" y="668" width="128" height="128" rx="34" fill="url(#amber)" transform="rotate(12 600 732)"/>
  <!-- the explored node -->
  <circle cx="512" cy="500" r="104" fill="url(#core)"/>
  <circle cx="512" cy="500" r="52" fill="#14304A"/>
  <circle cx="512" cy="500" r="22" fill="#7DD3E8"/>
</svg>
